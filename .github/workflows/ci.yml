name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ortus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      idp:
        # A test identity provider for signing in through an outside
        # provider (never shipped).
        image: ghcr.io/navikt/mock-oauth2-server:2.1.10
        ports:
          - 58080:8080
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025
      rustfs:
        image: rustfs/rustfs:1.0.6
        env:
          RUSTFS_ACCESS_KEY: ortusaccess
          RUSTFS_SECRET_KEY: ortussecret
        ports:
          - 9000:9000
    env:
      # Storage tests run on SQLite and on this PostgreSQL, file tests on a
      # local directory and on this RustFS. A missing service fails the
      # job instead of skipping the tests.
      ORTUS_TEST_POSTGRES: postgres://postgres:ortus@127.0.0.1:5432/postgres
      ORTUS_REQUIRE_POSTGRES: "1"
      ORTUS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      ORTUS_TEST_S3_BUCKET: ortus-test
      ORTUS_TEST_S3_ACCESS_KEY: ortusaccess
      ORTUS_TEST_S3_SECRET_KEY: ortussecret
      ORTUS_REQUIRE_S3: "1"
      ORTUS_REQUIRE_POSTGRES_TLS: "1"
      # A test mail server for sign-up codes (never shipped).
      ORTUS_TEST_SMTP: 127.0.0.1:1025
      ORTUS_TEST_MAILPIT: http://127.0.0.1:8025
      ORTUS_REQUIRE_SMTP: "1"
      ORTUS_TEST_IDP: http://127.0.0.1:58080/default
      ORTUS_REQUIRE_IDP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Create the test bucket
        env:
          AWS_ACCESS_KEY_ID: ortusaccess
          AWS_SECRET_ACCESS_KEY: ortussecret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for attempt in $(seq 30); do
            aws --endpoint-url "$ORTUS_TEST_S3_ENDPOINT" s3 mb "s3://$ORTUS_TEST_S3_BUCKET" && exit 0
            sleep 2
          done
          exit 1
      - name: A PostgreSQL that speaks TLS, with its own CA
        run: ci/postgres-tls.sh 55433 "$RUNNER_TEMP/pgtls" | sed 's/^export //' | tr ' ' '\n' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: "Web client: types, tests, licences, build"
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          node tools/licences.mjs
          node tools/licences.mjs --selftest
          npm run build
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Browser tests against the real program
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: ci/licence-gate-selftest.sh
