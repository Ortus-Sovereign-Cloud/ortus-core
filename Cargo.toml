[package]
name = "ortus-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Ortus core: storage, sign-in, policy, audit, search, admin, public API and web shell."
repository = "https://github.com/Ortus-Sovereign-Cloud/ortus-core"
publish = false

[lib]
name = "ortus_core"

[[bin]]
name = "ortus-core"
path = "src/bin/ortus-core.rs"

[dependencies]
rust-web-server = "18.34"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio-postgres = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
opendal = { version = "0.59", default-features = false, features = ["services-fs", "services-s3", "http-transport-reqwest", "auto-register-services"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
serde_json = "1.0.154"
rust-embed = "8.14.0"
sha2 = "0.11.1"
hex = "0.4.3"
opendal-http-transport-reqwest = { version = "0.59.5", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
webpki-roots = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
getrandom = "0.3"
base64 = "0.22"
argon2 = "0.5"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
aws-lc-rs = "1.19"
tokio-postgres-rustls = "0.13"
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls", "rustls", "aws-lc-rs", "webpki-roots", "builder", "hostname"] }

# Small debug builds: line numbers for our own code, no debug info for
# dependencies (a full debug build of the tests took 25 GB).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
